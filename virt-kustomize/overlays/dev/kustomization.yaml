apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: VirtualMachine
      version: v1
      group: kubevirt.io
      name: rhel10-gitops
    patch: |-
      - op: replace
        path: /spec/instancetype/name
        value: u1.medium
